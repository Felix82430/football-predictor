name: 足球量化情报官 · 0成本云端自动推送飞书

on:
  schedule:
    # 注意：GitHub Actions 使用 UTC 时间（北京时间 = UTC + 8）
    # v1.9 选用超冷门 17/47 分避开全球整点拥堵，并给晚间简报配 3 重保险！
    # 1) 每日 08:17 & 10:17（北京时间）：双保险核对昨晚完场比分并推赛后复盘（已发自动去重）
    - cron: "17 0,2 * * *"
    # 2) 每日 11:47 & 12:47（北京时间）：双保险推送午间初判简报（已发自动去重）
    - cron: "47 3,4 * * *"
    # 3) 每日 19:17 / 20:17 / 21:17（北京时间）：晚间简报三重保险（休赛日也会发未来48小时预告！）
    - cron: "17 11,12,13 * * *"
    # 4) 深夜欧洲比赛赛前约 1 小时临场终审与锁盘（北京时间 22:17 ~ 次日 03:17 + 02:47 欧冠加餐）
    - cron: "17 14,15,16,17,18,19 * * *"
    - cron: "47 18 * * *"

  # 支持在 GitHub 网页 Actions 页面随时手动点按钮一键触发测试
  workflow_dispatch:
    inputs:
      task:
        description: "选择要立即执行的任务"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - daily_noon
          - daily_evening
          - prematch_1h
          - daily_review
      force:
        description: "是否忽略当日去重强制推送一次"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-football-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取项目代码与历史数据库
        uses: actions/checkout@v4

      - name: 配置 Python 3.12 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 安装依赖包
        run: pip install -r requirements.txt

      - name: 执行足球量化分析、复盘与飞书推送
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          TASK="${{ github.event.inputs.task || 'auto' }}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python cloud_runner.py --task "$TASK" $FORCE_FLAG
          python export_site.py

      - name: 自动保存最新盘口快照、复盘台账并刷新手机网页
        run: |
          git config user.name "football-predictor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/football_predictor.db docs/
          if ! git diff --cached --quiet; then
            git commit -m "chore: 自动更新赛程盘口、复盘与手机云端网页 [skip ci]"
            git push
          fi
